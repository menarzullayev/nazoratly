[project]
name = "nazoratly-api"
version = "0.1.0"
description = "nazoratly backend API (education-center management + AI-agent control plane)"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "psycopg[binary,pool]>=3.2",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "structlog>=24.4",
  "sentry-sdk[fastapi]>=2.18",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp-proto-http>=1.28",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "mcp>=1.12,<2",
  "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "mypy>=1.13",
  "ruff>=0.8",
  "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nazoratly"]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "C4", "PL"]
ignore = [
  "E501",    # long SQL literals; the formatter handles code
  "S101",    # asserts are used only for type narrowing after INSERT .. RETURNING
  "S608",    # SQL is built only from whitelisted identifiers (see db.patch_row / resolve)
  "PLR0913", "PLR0917", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "B008", "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "PLR2004", "S311", "PLC0415", "RUF059", "SIM117"]
"src/nazoratly/observability.py" = ["PLC0415"]
"src/nazoratly/config.py" = ["PLC0415"]
"src/nazoratly/mcp_server.py" = ["PLC0415"]
"src/nazoratly/worker.py" = ["PLC0415"]  # exporters are optional, imported only when configured

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["nazoratly"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["db: needs Docker PostgreSQL"]
