name: publish-image
on:
  push: {branches: [main]}
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Build and push (image is built from this commit; deploy = pull this tag on the server)
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          docker build -f backend/Dockerfile -t "$IMAGE:${GITHUB_SHA::12}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${GITHUB_SHA::12}"
          docker push "$IMAGE:latest"
