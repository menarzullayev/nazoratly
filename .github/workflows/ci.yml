name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {version: "0.11.3", enable-cache: true, cache-dependency-glob: backend/uv.lock}
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests && uv run ruff format --check src tests
      - name: Types (mypy strict)
        run: uv run mypy
      - name: Tests (real PostgreSQL 16 in Docker)
        run: uv run pytest tests -q
      - name: OpenAPI document is up to date
        run: |
          uv run python scripts/export_openapi.py /tmp/openapi.json
          diff -q /tmp/openapi.json ../clients/typescript/openapi.json || { echo "run: cd backend && uv run python scripts/export_openapi.py ../clients/typescript/openapi.json && (cd ../clients/typescript && npm run generate)"; exit 1; }
      - name: Dependency audit
        run: |
          uv export --frozen --no-dev --no-emit-project -o /tmp/req.txt -q
          uv run pip-audit -r /tmp/req.txt --disable-pip

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Schema tests (up, test, down to empty, up, test)
        run: bash db/scripts/test_migrations.sh

  client:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: clients/typescript}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - run: npm ci --no-audit --no-fund
      - name: Generated types match openapi.json
        run: npm run generate && git diff --exit-code src/schema.d.ts
      - run: npm run typecheck

  sheets:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: sheets}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - run: npm ci --no-audit --no-fund
      - name: Types, tests, bundle
        run: npm run check

  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - run: npm ci --no-audit --no-fund
      - name: Lint, types, unit tests, static build
        run: npm run lint && npm run typecheck && npm test && npm run build
      - name: Browser tests (e2e, axe)
        run: npx playwright install --with-deps chromium && npm run e2e
      - name: Lighthouse (median of 3 runs per route, mobile and desktop)
        run: |
          npx --yes serve@14 out -l 4173 --no-clipboard &
          npx --yes wait-on@8 http://127.0.0.1:4173/
          B=http://127.0.0.1:4173
          node scripts/lighthouse.mjs --runs 3 --preset both --min 95 $B/ $B/uz-cyrl/ $B/uz-new/ $B/ru/ $B/en/

  web-ui:
    # Browser tests of the pages the API itself serves (/ui/*: guardian portal, teacher Mini App, calendar, QR scan, import).
    # The test run starts its own stack: Postgres in Docker on a random port, the real app, a fake Telegram. Runs in
    # parallel with `web` so the landing job stays short.
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - uses: astral-sh/setup-uv@v5
        with: {version: "0.11.3", enable-cache: true, cache-dependency-glob: backend/uv.lock}
      - run: npm ci --no-audit --no-fund
      - run: uv sync --frozen
        working-directory: backend
      - run: npx playwright install --with-deps chromium
      - name: Browser tests against the test stack (guardian, teacher, scan, calendar, import, axe)
        run: npm run e2e:api

  panel:
    # The staff web panel: lint (no raw HTML, no untranslated text), types, unit tests (dictionaries, coverage manifest
    # against openapi.json, cookie-session rules), the production image, then browser tests of every role against the
    # real API and PostgreSQL behind the panel's own nginx configuration.
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: panel}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - uses: astral-sh/setup-uv@v5
        with: {version: "0.11.3", enable-cache: true, cache-dependency-glob: backend/uv.lock}
      - run: npm ci --no-audit --no-fund
      - name: Lint, types, unit tests, build
        run: npm run lint && npm run typecheck && npm test && npm run build
      - name: The image builds and serves the panel
        run: |
          docker build -f Dockerfile -t nazoratly-panel:ci ..
          docker run -d --rm --name panel-ci -p 127.0.0.1:8013:80 nazoratly-panel:ci
          curl -sS --retry 20 --retry-all-errors --retry-delay 1 -f http://127.0.0.1:8013/app/students -o /tmp/index.html
          grep -q '/app/assets/' /tmp/index.html
          docker stop panel-ci
      - run: uv sync --frozen
        working-directory: backend
      - run: npx playwright install --with-deps chromium
      - name: Browser tests (every role, sessions, denial, languages, axe) against the test stack
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: panel-test-results, path: panel/test-results, retention-days: 3}

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Secret scan (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact -v

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t nazoratly-api:ci .
      - name: Container runs as non-root and the app imports
        run: |
          [ "$(docker run --rm --entrypoint id nazoratly-api:ci -u)" = "10001" ]
          docker run --rm --entrypoint python nazoratly-api:ci -c "import nazoratly.main"
