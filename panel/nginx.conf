server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  # a reset link carries its code in the URL fragment, which never reaches this server or its log

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;
  gzip_min_length 512;

  location = /app {
    include /etc/nginx/security-headers.conf;
    return 301 /app/;
  }

  # hashed build output never changes
  location /app/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  # every in-app address is served by index.html, which is never cached: a new release is picked up at once
  location /app/ {
    add_header Cache-Control "no-store" always;
    include /etc/nginx/security-headers.conf;
    try_files $uri /app/index.html;
  }

  location / {
    include /etc/nginx/security-headers.conf;
    return 404;
  }
}
