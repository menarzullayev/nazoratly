# Local/demo stack: PostgreSQL 16 + one-shot migrations + API.   cp .env.example .env  (fill it)  &&  docker compose up --build
# Production: run the same image behind a TLS-terminating proxy, with managed PostgreSQL, and set NAZORATLY_ENV=prod.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: nazoratly
    volumes:
      - nazoratly-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nazoratly"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    image: nazoratly-backend:latest
    command: ["sh", "-c", "python -m nazoratly.migrate up && python -m nazoratly.migrate roles"]
    environment:
      NAZORATLY_MIGRATE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/nazoratly
      NAZORATLY_APP_PASSWORD: ${NAZORATLY_APP_PASSWORD:?}
      NAZORATLY_AUTH_PASSWORD: ${NAZORATLY_AUTH_PASSWORD:?}
      NAZORATLY_AGENT_PASSWORD: ${NAZORATLY_AGENT_PASSWORD:?}
      NAZORATLY_WORKER_PASSWORD: ${NAZORATLY_WORKER_PASSWORD:?}
    depends_on:
      db: {condition: service_healthy}
    restart: "no"

  api:
    # One build for the whole backend image: api, migrate, mcp and worker all run it (before, four identical
    # parallel builds ran on every `up --build`, which cost 4x the CPU/RAM peak and four history entries).
    build: {context: ., dockerfile: backend/Dockerfile}
    image: nazoratly-backend:latest
    environment:
      NAZORATLY_ENV: ${NAZORATLY_ENV:-dev}
      NAZORATLY_TRUST_PROXY_HEADERS: ${NAZORATLY_TRUST_PROXY_HEADERS:-false}
      NAZORATLY_CLIENT_IP_HEADER: ${NAZORATLY_CLIENT_IP_HEADER:-cf-connecting-ip}
      NAZORATLY_DATABASE_URL_APP: postgresql://nazoratly_app:${NAZORATLY_APP_PASSWORD}@db:5432/nazoratly
      NAZORATLY_DATABASE_URL_AUTH: postgresql://nazoratly_auth:${NAZORATLY_AUTH_PASSWORD}@db:5432/nazoratly
      NAZORATLY_JWT_SECRET: ${NAZORATLY_JWT_SECRET:?set NAZORATLY_JWT_SECRET in .env}
      NAZORATLY_SECRETS_KEY: ${NAZORATLY_SECRETS_KEY:-}
      NAZORATLY_TG_RELAY_TARGET: ${NAZORATLY_TG_RELAY_TARGET:-}
      NAZORATLY_TG_RELAY_SECRET: ${NAZORATLY_TG_RELAY_SECRET:-}
      # shared Telegram bot (docs/DEPLOY.md); the public https address is also where bot webhooks and the Mini App live
      NAZORATLY_TELEGRAM_BOT_TOKEN: ${NAZORATLY_TELEGRAM_BOT_TOKEN:-}
      NAZORATLY_TELEGRAM_BOT_USERNAME: ${NAZORATLY_TELEGRAM_BOT_USERNAME:-}
      NAZORATLY_PUBLIC_BASE_URL: ${NAZORATLY_PUBLIC_BASE_URL:-}
      NAZORATLY_TEACHER_REMINDER_INTERVAL_S: ${NAZORATLY_TEACHER_REMINDER_INTERVAL_S:-300}
      # AI assistant: the host-side worker (python -m nazoratly.ai_host_worker), empty = AI not configured (rule-based reports)
      NAZORATLY_AI_WORKER_URL: ${NAZORATLY_AI_WORKER_URL:-}
      NAZORATLY_AI_WORKER_TOKEN: ${NAZORATLY_AI_WORKER_TOKEN:-}
      NAZORATLY_AI_MODEL: ${NAZORATLY_AI_MODEL:-haiku}
      NAZORATLY_CORS_ORIGINS: ${NAZORATLY_CORS_ORIGINS:-[]}
      NAZORATLY_SENTRY_DSN: ${NAZORATLY_SENTRY_DSN:-}
      NAZORATLY_OTEL_EXPORTER_OTLP_ENDPOINT: ${NAZORATLY_OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "127.0.0.1:${NAZORATLY_API_PORT:-8000}:8000"
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  mcp:
    image: nazoratly-backend:latest
    command: ["python", "-m", "nazoratly.mcp_server"]
    environment:
      NAZORATLY_DATABASE_URL_AGENT: postgresql://nazoratly_agent:${NAZORATLY_AGENT_PASSWORD}@db:5432/nazoratly
      NAZORATLY_MCP_ALLOWED_HOSTS: ${NAZORATLY_MCP_ALLOWED_HOSTS:-[]}
    ports:
      - "127.0.0.1:${NAZORATLY_MCP_PORT:-8001}:8001"
    healthcheck:  # the image's own check targets the API port (8000), which this service does not serve
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  worker:
    image: nazoratly-backend:latest
    command: ["python", "-m", "nazoratly.worker"]
    environment:
      NAZORATLY_DATABASE_URL_WORKER: postgresql://nazoratly_worker:${NAZORATLY_WORKER_PASSWORD}@db:5432/nazoratly
      NAZORATLY_TELEGRAM_BOT_TOKEN: ${NAZORATLY_TELEGRAM_BOT_TOKEN:-}
      NAZORATLY_SECRETS_KEY: ${NAZORATLY_SECRETS_KEY:-}  # decrypts the bot tokens of centers' own bots
      NAZORATLY_ESKIZ_EMAIL: ${NAZORATLY_ESKIZ_EMAIL:-}
      NAZORATLY_ESKIZ_PASSWORD: ${NAZORATLY_ESKIZ_PASSWORD:-}
      NAZORATLY_ESKIZ_FROM: ${NAZORATLY_ESKIZ_FROM:-4546}
    healthcheck:  # no HTTP port: the worker touches a heartbeat file after each polling cycle
      test: ["CMD", "python", "-m", "nazoratly.worker", "--healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  # The staff web panel (static files under /app). The tunnel sends ^/app(/|$) here and /v1 to the api: one origin,
  # which must equal the origin of NAZORATLY_PUBLIC_BASE_URL, or the panel's sign-in routes answer 403.
  panel:
    build:
      context: .
      dockerfile: panel/Dockerfile
    ports:
      - "127.0.0.1:${NAZORATLY_PANEL_PORT:-8013}:80"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_DEMO_SHEET_COPY_URL: ${NEXT_PUBLIC_DEMO_SHEET_COPY_URL:-}
    ports:
      - "127.0.0.1:${NAZORATLY_WEB_PORT:-8012}:80"
    restart: unless-stopped

volumes:
  nazoratly-pgdata:
